<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰箱贴 · 材质实码对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#302f29;font:15px system-ui;padding:30px}main{max-width:1240px;margin:auto}h1{font-size:25px;margin:0}p{line-height:1.6;color:#797569}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,label{border:0;border-radius:22px;background:#e7e1d5;padding:11px 16px;font:inherit;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#423f33;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.stage{height:430px;background:#ebe5d7;border-radius:26px;display:grid;place-items:center;position:relative;overflow:hidden}.subject{position:absolute;inset:22px 35px;width:calc(100% - 70px);height:calc(100% - 44px);object-fit:contain;filter:drop-shadow(0 3px 1px #fff) drop-shadow(0 8px 7px #5a493025)}.readout{position:relative;z-index:1;margin-top:104px;filter:drop-shadow(0 1px 1px #5f49261e) drop-shadow(0 7px 8px #5f49261e)}h2{font-size:16px;margin:14px 0 5px}small{color:#797569;line-height:1.6}input[type=color]{width:30px;height:30px;border:0;padding:0;background:transparent;vertical-align:middle}footer{margin:24px 0;color:#797569;font-size:12px;line-height:1.7}@media(max-width:850px){.grid{grid-template-columns:1fr}.stage{height:360px}body{padding:20px}}
</style><main><h1>同一张卡，三种质感</h1><p>只比较衬底。轮廓、文字和尺寸一致；拖动、时钟更新不会重新生成纹理。</p><nav id="kinds"><button data-kind="timetable" aria-pressed="true">课程表</button><button data-kind="agenda">日程</button><button data-kind="battery">电量</button><button data-kind="clock">时间</button></nav><nav><label>主体采色 <input id="tint" type="color" value="#e9ba48"></label><label>载入自己的主体图 <input id="photo" type="file" accept="image/*" hidden></label><button id="dark">深色背景</button></nav><div class="grid" id="samples"></div><footer>实际代码原型：参数和轮廓来自 App 的生产模型，原生 ReadingBacking 同时支持这两版。浏览器阴影及字体有平台差异；本轮未做真机像素对照。D / E 为实验材质，不会改动已保存画布。</footer></main>
<script src="shared-models.js"></script><script src="shared-materials.js"></script><script src="capabilities.js"></script><script src="material-study-local.js"></script><script>
const load=FridgeCore.load,schema=load('CardSchema'),now=new Date('2026-09-07T10:00:00').getTime();let kind='timetable',tint='#e9ba48',photo=globalThis.materialStudyPhoto||'',dark=false;
const names=['现有云朵','D · 轻透磨砂','E · 暖白细纸'],notes=['现有两层纯色，作为对照','表面透光，采色在右下缓缓散开；薄边','更暖更实的纸面，细纤维与柔和侧厚度'];
function render(){document.querySelectorAll('#kinds button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===kind));document.getElementById('samples').innerHTML=[0,4,5].map((v,i)=>{const c=new schema.FridgeCard();c.id='material'+v;c.w=kind==='clock'?150:kind==='battery'?140:240;c.h=kind==='clock'?84:kind==='battery'?160:174;c.paper='#eed58b';c.ink='#302d23';c.capFree=true;c.capBox={x:0,y:0,w:1,h:1,rot:0,opacity:1};c.capability={k:kind,readingBlend:'cloud',readingStyle:'surface',readingTint:tint,readingMaterialStudy:v,percent:67,charging:true,timetableMode:'day',semester:'2026-08-31',courses:['高等数学','软件工程','交互设计'].map((name,j)=>({id:'c'+j,name,room:['教学楼 A101','实验楼 B301','艺术楼 C402'][j],day:1,start:['10:30','14:00','16:30'][j],end:['12:00','15:30','18:00'][j],firstWeek:1,lastWeek:20,parity:0})),agendaSource:'manual',events:['产品评审','需求对齐','健身训练'].map((title,j)=>({id:'e'+j,title,start:now+(j+1)*3600000,end:now+(j+2)*3600000,location:'会议室 A',allDay:false}))};return `<article><div class="stage" style="background:${dark?'#363b37':'#ebe5d7'}">${photo?'<img class="subject" src="'+photo+'">':''}<svg class="readout" width="${c.w+60}" height="${c.h+60}" viewBox="-30 -30 ${c.w+60} ${c.h+60}" font-family="system-ui">${FridgeReadouts.capability(c,now,c.id)}</svg></div><h2>${names[i]}</h2><small>${notes[i]}</small></article>`}).join('')}
document.querySelectorAll('#kinds button').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});document.getElementById('tint').oninput=e=>{tint=e.target.value;render()};document.getElementById('dark').onclick=()=>{dark=!dark;render()};document.getElementById('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)};render();
</script></html>
