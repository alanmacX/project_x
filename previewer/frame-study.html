<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冰箱贴 · 框体材质实验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#242723;font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:22px;background:#e7e4dc;color:inherit;padding:9px 16px}button[aria-pressed=true]{background:#30372f;color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #919e80;outline-offset:3px}header{max-width:1440px;margin:auto;padding:26px 32px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:21px;font-weight:600;margin:0;letter-spacing:.02em}header p{color:#73766e;margin:4px 0 0;font-size:13px}main{max-width:1440px;margin:auto;padding:0 32px 30px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.stage{border-radius:26px;min-height:660px;padding:30px;display:flex;align-items:center;justify-content:center;background:#77858a;position:relative;overflow:hidden;transition:background .25s}.stage[data-wall=light]{background:linear-gradient(125deg,#ddd8ca,#f3eee4 50%,#c1bba9)}.stage[data-wall=dark]{background:linear-gradient(120deg,#444e53,#77858a 58%,#485d62)}.stage[data-wall=photo]{background:radial-gradient(ellipse at 18% 5%,#a1afb7 0,transparent 55%),linear-gradient(154deg,transparent 50%,#3f6557 50.2%,#709881 70%,#a6ad80),linear-gradient(#819cad,#d6d6c2)}.board{width:min(100%,720px);aspect-ratio:1.15;position:relative;isolation:isolate}.board canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}.props{position:absolute;inset:10%;display:flex;gap:15px;align-items:center;justify-content:center;transition:opacity .15s}.props.hidden{opacity:0}.paper{background:#f9f5e9;width:39%;padding:20px 16px;border-radius:10px;box-shadow:0 3px 2px #26271e21,0 12px 20px #222a232f;transform:rotate(-7deg);font-family:Georgia,'Songti SC',serif}.paper small{font:12px system-ui;letter-spacing:.04em;color:#777566}.paper strong{display:block;font-size:clamp(24px,3.6vw,43px);font-weight:500;margin:8px 0}.paper span{display:block;border-top:1px solid #b4af9433;padding-top:8px;font-size:13px}.album{width:35%;aspect-ratio:1;background:linear-gradient(160deg,#273d3d,#d7a477);border:12px solid #fff8e7;border-radius:10px;box-shadow:0 3px 2px #252e262a,0 12px 20px #222a233f;transform:rotate(9deg);display:flex;align-items:end;padding:12px;color:#fff5de;font:italic 25px Georgia;position:relative;overflow:hidden}.album:before{content:'';position:absolute;width:100%;height:90%;border-radius:50%;background:#f2cd9135;left:25%;top:35%}.label{position:absolute;bottom:16px;left:22px;color:#fff9;font-size:12px;letter-spacing:.08em;pointer-events:none}.panel{background:#fffcf7;border-radius:24px;padding:22px;height:fit-content}.section{padding:17px 0;border-top:1px solid #dfdfd44f}.section:first-child{padding-top:0;border-top:0}.section h2{font-size:13px;color:#71756c;font-weight:500;margin:0 0 12px}.choices{display:flex;gap:7px;flex-wrap:wrap}.choices button{font-size:13px;padding:8px 12px}.control{display:grid;grid-template-columns:1fr auto;gap:8px;margin:15px 0;font-size:13px}.control input{grid-column:1/-1;width:100%;accent-color:#687961}output{color:#73796d;font-variant-numeric:tabular-nums}.toggle{display:flex;align-items:center;gap:9px;font-size:13px}.toggle input{accent-color:#687961;width:17px;height:17px}.notes{font-size:12px;color:#7c8075;line-height:1.7;margin:12px 0 0}.footer{max-width:1440px;margin:auto;padding:0 32px 25px;font-size:12px;color:#7c8075}#status{font-variant-numeric:tabular-nums}#export{width:100%;background:#e6eadf}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);border-radius:20px;background:#28302ae8;color:white;padding:10px 18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:950px){main{grid-template-columns:1fr}.stage{min-height:490px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:0 25px}.section:first-child{padding-top:17px}.section{border-top:0}.notes{max-width:430px}}@media(max-width:550px){header{padding:20px 18px}header p{max-width:250px}main{padding:0 12px 20px;gap:12px}.stage{padding:16px;min-height:360px;border-radius:20px}.panel{padding:18px;gap:0 18px}.paper{padding:12px}.paper strong{font-size:25px}.album{border-width:7px;font-size:18px}.footer{padding:0 18px 20px}.label{font-size:10px;bottom:10px;left:14px}}
</style>
<header><div><h1>框体 · 材质实验</h1><p>同一截面、同一束光，比较白岩与木材的真实代码效果。</p></div><button id="reset">重置</button></header>
<main><div class="stage" id="stage" data-wall="dark"><div class="board" id="board"><div class="props" id="props"><div class="paper"><small>接下来</small><strong>14:30</strong><span>留一点时间给自己</span></div><div class="album">Collected moments.</div></div><canvas id="frame" aria-label="框体材质预览"></canvas></div><div class="label" id="label">致密白岩 · 细哑光</div></div>
<aside class="panel">
<section class="section"><h2>材质</h2><div class="choices" data-key="material"><button data-value="stone">致密白岩</button><button data-value="walnut">胡桃木</button><button data-value="oak">浅橡木</button></div><p class="notes" id="materialNote"></p></section>
<section class="section"><h2>放在桌面上看</h2><div class="choices" data-key="wall"><button data-value="dark">深色</button><button data-value="light">浅色</button><button data-value="photo">风景</button></div><label class="toggle" style="margin-top:14px"><input type="checkbox" id="content" checked>显示卡片，检查是否抢眼</label></section>
<section class="section"><h2>画布比例</h2><div class="choices" data-key="ratio"><button data-value="1.15">平板</button><button data-value="1">手机</button><button data-value="1.8">横向</button></div><label class="toggle" style="margin-top:14px"><input type="checkbox" id="square">直角框 · 社媒分享</label></section>
<section class="section"><h2>截面与质感</h2>
<label class="control">框宽 <output id="widthOut"></output><input id="width" type="range" min="14" max="46" step="1"></label>
<label class="control">体积深度 <output id="depthOut"></output><input id="depth" type="range" min="2" max="16" step=".5"></label>
<label class="control">微纹理 <output id="grainOut"></output><input id="grain" type="range" min="0" max="100" step="1"></label>
<label class="control">内侧斜切 <output id="bevelOut"></output><input id="bevel" type="range" min="12" max="42" step="1"></label>
</section><section class="section"><h2>选定后带回 App</h2><button id="export">复制当前配方</button><p class="notes">此处只做材质实验。中心真实透明，四角有连续切面。调整后静态绘制，空闲时不持续运行动画。</p></section>
</aside></main><div class="footer">代码生成的截面光照与确定性微纹理 · <span id="status">准备中</span></div><div class="toast" id="toast" role="status">配方已复制</div>
<script src="frame-study.js"></script>
</html>
