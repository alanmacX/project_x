<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰箱贴 · 模板总览</title><link rel="stylesheet" href="templates.css"><style>*{box-sizing:border-box}body{margin:0;background:#e7e8e5;color:#293129;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1280px;padding:30px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px}header h1{font-size:23px;margin:0}header span{font-size:12px;color:#7b8475}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 26px}figure{margin:0;min-width:0}.mount{aspect-ratio:1.08;display:flex;align-items:center;justify-content:center;padding:16px;border-radius:22px;background:#d8dcd4}.slot{width:100%;container-type:inline-size;max-width:var(--size,none);margin:auto}.art{box-shadow:0 2px 2px #0001,0 8px 20px #25342515}figcaption{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;gap:12px}figcaption span{font-size:10px;color:#7b8475}footer{font-size:11px;color:#7b8475;margin-top:28px}@media(max-width:650px){main{padding:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}.mount{padding:9px}header h1{font-size:18px}}</style><main><header><h1 id="title">卡片模板</h1><span>冰箱贴 · 设计样稿</span></header><div class="grid"></div><footer>示例数据 · 真实照片：Painjet · 纸张：ambientCG · 字体：Barlow / OFL</footer></main><script src="../../previewer/shared-models.js"></script><script src="catalog.js"></script><script src="fixtures.js"></script><script src="renderers.js"></script><script>
const q=new URLSearchParams(location.search),collection=q.get('collection'),page=Number(q.get('page')||0),size=Number(q.get('size')||0),kind=q.get('kind');let items=TemplateCatalog.catalog;
if(collection==='featured'){const ids=['standby','dial','portrait','calendar-month','countdown-poster','year-dots','battery-cell','agenda-editorial','course-next','lunar-paper','album-record','mix-modular'];items=items.filter(c=>ids.includes(c.id));document.getElementById('title').textContent='模板精选 · 12 款';}
else if(collection==='ensembles'){items=items.filter(c=>c.kind==='ensemble');document.getElementById('title').textContent='多能力组合 · 5 组';}
else if(page){items=items.filter(c=>c.kind!=='ensemble').slice((page-1)*15,page*15);document.getElementById('title').textContent='单卡模板 · '+page+'/3';}
else if(kind)items=items.filter(c=>c.kind===kind);
if([180,300,420].includes(size))document.documentElement.style.setProperty('--size',size+'px');
const scenario=q.get('scenario')||'demo';document.querySelector('.grid').innerHTML=items.map(c=>`<figure data-id="${c.id}"><div class="mount"><div class="slot">${TemplateRender.render(c.id,{scenario})}</div></div><figcaption>${c.name}<span>${TemplateCatalog.categories.find(([k])=>k===c.kind)[1]}</span></figcaption></figure>`).join('');
</script></html>
