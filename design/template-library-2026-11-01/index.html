<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰箱贴 · 模板样稿库</title><link rel="stylesheet" href="templates.css"><link rel="stylesheet" href="gallery.css"><body>
<header class="page-head"><div><h1>模板样稿</h1><p>40 款单卡 · 5 组组合</p></div><nav><a href="DESIGN-REFERENCES.md">参考与设计</a><a href="README.md">样稿说明</a></nav></header>
<main><div class="toolbar"><div id="filters" role="group" aria-label="按能力筛选"></div><div class="view-controls"><label>尺寸<select id="size"><option value="300">标准</option><option value="180">小尺寸</option></select></label><label>数据<select id="scenario"><option value="demo">示例</option><option value="empty">未设置</option><option value="long">长内容</option></select></label><button id="review" aria-pressed="false">只看收藏 <span id="picked-count">0</span></button></div></div>
<div id="results" aria-live="polite"></div><div id="gallery"></div><div id="no-results" hidden>还没有收藏模板。</div></main>
<footer class="page-footer">设计样稿 · 时间、电量与日程采用示例数据 · <a href="../template-capabilities-2026-11-01/LICENSES.md">真实素材与字体授权</a></footer>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-name"></h2><button id="close" aria-label="关闭">×</button></div><div class="detail-layout"><div><div id="stage" class="stage"></div><div class="placement" role="group" aria-label="放置方式"><button data-place="card" aria-pressed="true">作为卡片</button><button data-place="fill" aria-pressed="false">铺满画布</button></div></div><aside><p id="sources"></p><fieldset><legend>配色</legend><div class="palettes"><button data-palette="" aria-pressed="true">原配</button><button data-palette="cobalt" aria-pressed="false">钴蓝</button><button data-palette="cream" aria-pressed="false">纸白</button><button data-palette="ink" aria-pressed="false">墨黑</button></div></fieldset><label id="dial-time-field" hidden>预览时间<input id="dial-time" type="time" value="09:41"></label><label id="title-field">标题<input id="title" maxlength="48" placeholder="保留原文"></label><label id="depth-field" hidden>景深<input type="checkbox" id="depth" checked></label><div id="host-controls" hidden><label>背景<select id="background"><option value="template">随模板</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>画框<select id="frame"><option value="none">无</option><option value="stone">白岩</option><option value="walnut">胡桃木</option><option value="oak">浅橡木</option></select></label></div><p id="customizable"></p><button id="pick">收藏这款</button></aside></div></dialog>
<script src="../../previewer/shared-models.js"></script><script src="../../previewer/shared-materials.js"></script><script src="../../previewer/capabilities.js"></script><script src="../../previewer/renderer.js"></script><script src="catalog.js"></script><script src="fixtures.js"></script><script src="renderers.js"></script><script src="gallery.js"></script></body></html>
