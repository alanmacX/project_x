<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板精修 · 调色盘</title><link rel="stylesheet" href="templates.css"><style>*{box-sizing:border-box}body{margin:0;background:#e7e8e5;color:#2a302b;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1380px;padding:32px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:25px}h1{margin:0;font-size:24px}header a{font-size:12px;color:#76806f;text-decoration:none}.palette-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 26px}figure{margin:0;min-width:0}.mount{padding:13px;border-radius:23px;background:#d8dcd4}.slot{container-type:inline-size;width:100%}.art{box-shadow:0 2px 3px #0001,0 10px 20px #24352314}figcaption{display:flex;justify-content:space-between;gap:15px;font-size:12px;margin-top:12px}figcaption small{font-size:10px;color:#7c8576}section>h2{font-size:18px;font-weight:550;margin:35px 0 22px}footer{font-size:11px;color:#7b8475;margin-top:30px}.hero-only .more{display:none}@media(max-width:700px){main{padding:23px 17px}.palette-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 15px}.more-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 15px}.mount{padding:9px;border-radius:17px}h1{font-size:21px}}</style><main><header><h1>调色盘 · 重做</h1><a href="index.html">完整模板库</a></header><section class="palette-grid" id="palette"></section><section class="more"><h2>其他精修样稿</h2><div class="more-grid" id="more"></div></section><footer>真实代码渲染 · 示例时间 09:41 · 配色可随时间变化</footer></main><script src="../../previewer/shared-models.js"></script><script src="catalog.js"></script><script src="fixtures.js"></script><script src="renderers.js"></script><script>
const fig=(id,opts,label)=>`<figure><div class="mount"><div class="slot">${TemplateRender.render(id,opts)}</div></div><figcaption>${label||TemplateCatalog.catalog.find(c=>c.id===id).name}<small>${id==='dial'?'调色盘':'精修'}</small></figcaption></figure>`;
document.getElementById('palette').innerHTML=[['','光谱'],['cobalt','海蓝'],['cream','暖光'],['ink','暮紫']].map(([palette,label])=>fig('dial',{palette},label)).join('');document.getElementById('more').innerHTML=['countdown-orbit','day-dial','year-arc','course-week','calendar-ledger','battery-segments'].map(id=>fig(id,{})).join('');if(new URLSearchParams(location.search).has('hero'))document.body.classList.add('hero-only');
</script></html>
