<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板发布验收</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e7e8e6;color:#202421;font:15px system-ui}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}h1{font-size:22px;margin:0}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:8px;border-radius:8px;border:1px solid #aaa;background:#fff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--size)),1fr));gap:24px}article{min-width:0}figure{margin:0;width:var(--size);max-width:100%;height:var(--size);display:flex;align-items:center}figure svg{display:block;width:100%;height:auto}h2{font-size:14px;font-weight:500;margin:10px 0}#result{margin:12px 0;font-size:13px}</style>
<header><h1>44 款模板 · 发布验收</h1><label>数据<select id="mode"><option value="normal">日常</option><option value="long">长文本／密集课程</option><option value="empty">空数据</option><option value="invalid">边界数据</option></select></label><label>配色<select id="palette"><option value="">原色</option><option value="cream">奶油</option><option value="cobalt">钴蓝</option><option value="ink">墨色</option></select></label><label>画幅<select id="aspect"><option value="1">方形</option><option value="2">横向</option></select></label><label>尺寸<select id="size"><option value="180">180vp</option><option value="300">300vp</option></select></label></header><main></main>
<script src="../../previewer/shared-models.js"></script><script src="../../previewer/shared-materials.js"></script><script src="../../previewer/capabilities.js"></script><script src="../../previewer/renderer.js"></script><script src="fixtures.js"></script><script>
(async()=>{const font=new FontFace('TemplateDigits',`url(${FridgeMaterials.template_digits})`);await font.load();document.fonts.add(font);
window.reviewDraw=()=>{const mode=document.querySelector('#mode').value,palette=document.querySelector('#palette').value,aspect=Number(document.querySelector('#aspect').value),size=Number(document.querySelector('#size').value);document.documentElement.style.setProperty('--size',size+'px');document.querySelector('main').innerHTML=TemplateReview.catalog.map(def=>{const card=TemplateReview.card(def.id,mode,palette,aspect),state=FridgeCore.load('CardSchema').defaultState();state.canvasAspect=card.w/card.h;state.background.mode='transparent';card.x=0;card.y=0;card.w=344;card.h=344/state.canvasAspect;state.cards=[card];const svg=FridgeWeb.renderPackage({format:'fridgememo-template',version:3,kind:'canvas',state,assets:[]},size,TemplateReview.tick,{namespace:def.id}).svg;return `<article data-id="${def.id}"><figure>${svg}</figure><h2>${def.name}</h2></article>`;}).join('');};for(const select of document.querySelectorAll('select'))select.onchange=reviewDraw;reviewDraw();window.reviewReady=true;})();</script></html>
