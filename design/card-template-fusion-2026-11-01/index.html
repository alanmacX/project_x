<header class="study"><strong>卡片模板 · 融合原型</strong><nav><a href="ARCHITECTURE.md">重构方案</a><a href="#concepts">概念稿</a></nav></header>
<main><div class="demo-switch" role="group" aria-label="演示画布"><button id="solo" aria-pressed="true">单卡画布</button><button id="ensemble" aria-pressed="false">自由组合</button></div>

<div id="add-menu" hidden><button data-add="agenda">日程</button><button data-add="note">便签</button></div>
<div class="workspace"><div class="board-wrap"><div id="board" class="board solo" aria-label="画布">
<div id="clock-card" class="clock-card photo depth sage" role="img" aria-label="景深照片时钟，09:41"><div class="clock-surface"></div><div class="clock-time">09:41</div><div class="cat-wrap"><img id="cat" src="../template-capabilities-2026-11-01/assets/cat-pipi.webp" alt="Painjet 拍摄的皮皮"></div></div>

</div><p class="stage-caption" id="stage-caption">1 张卡片 · 2×2 画布</p></div>

<label class="line"><span>景深</span><input id="depth" type="checkbox" role="switch" checked></label>
<fieldset><legend>呈现</legend><div class="choices"><button data-surface="photo" aria-pressed="true">照片卡</button><button data-surface="bare" aria-pressed="false">无底</button></div></fieldset>
<fieldset><legend>配色</legend><div class="swatches"><button class="sage" data-palette="sage" aria-label="草绿" aria-pressed="true"></button><button class="lilac" data-palette="lilac" aria-label="淡紫" aria-pressed="false"></button><button class="sand" data-palette="sand" aria-label="沙色" aria-pressed="false"></button></div></fieldset>
