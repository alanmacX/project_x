<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰箱贴 · 风格与自由编辑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e3df;color:#242321;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}main{max-width:1140px;margin:auto;padding:36px 32px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}h1{font-size:28px;letter-spacing:-1px;margin:0}header span{font-size:13px;color:#686561}.families{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.family{padding:0;border:0;border-radius:0;background:transparent;text-align:left;color:inherit;font:inherit;cursor:pointer}.family img{display:block;width:100%;border-radius:18px;transition:transform .18s}.family:hover img{transform:translateY(-3px)}.family span{display:block;padding:12px 0 10px;font-size:16px;border-bottom:2px solid transparent}.family[aria-pressed=true] span{border-color:#242321}.workbench{margin-top:32px;border-top:1px solid #c4c1ba;padding-top:30px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:56px}.stage{width:min(100%,420px);margin:auto;touch-action:pan-y}.stage svg{display:block;width:100%;height:auto}.stage.editing{touch-action:none;cursor:grab}.stage.editing:active{cursor:grabbing}.settings{display:flex;flex-direction:column;gap:20px}label{display:flex;flex-direction:column;gap:9px;font-size:13px;color:#635f59}select,button.action{font:inherit;font-size:14px;border:1px solid #bdb9b1;background:transparent;border-radius:10px;padding:11px 12px;color:#242321}.actions{display:flex;flex-direction:column;gap:10px;margin-top:auto}button{cursor:pointer}button.primary{background:#242321;color:#fff;border-color:#242321}button:disabled{opacity:.4;cursor:default}#mode{border-color:#242321}#status{font-size:12px;min-height:18px;color:#635f59;margin:0}footer{font-size:12px;color:#77716a;margin-top:28px}@media(max-width:700px){main{padding:24px 18px}header span{display:none}.families{gap:12px}.family img{border-radius:12px}.family span{font-size:14px}.workbench{grid-template-columns:1fr;gap:24px;margin-top:18px;padding-top:24px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions,#status{grid-column:1/-1}.actions{display:grid;grid-template-columns:1fr 1fr}.actions #download{grid-column:1/-1}h1{font-size:24px}}
</style>
<main><header><h1>选一个起点</h1><span>风格与自由编辑 · 交互原型</span></header><section class="families" aria-label="风格"></section><section class="workbench"><div class="stage" aria-label="画布预览"></div><div class="settings"><label>尺寸<select id="size"><option value="4*4">4×4</option><option value="2*2">2×2</option></select></label><label>配色<select id="palette"><option value="original">原配色</option><option value="alternate">另一组配色</option></select></label><label>主位置<select id="content"><option value="clock">本地时间</option><option value="worldclock">东京时间</option></select></label><label>预览数据<select id="data"><option value="demo">演示数据</option><option value="empty">未配置</option><option value="long">长内容</option></select></label><div class="actions"><button class="action" id="mode">自由编辑</button><button class="action" id="undo" disabled>撤销</button><button class="action primary" id="download">保存为 .fridge</button></div><p id="status" role="status"></p></div></section><footer>时间、电量、日程使用原生能力。演示数据不写入作品。</footer></main>
