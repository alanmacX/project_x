<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰箱贴 · 简约模块</title><style>
*{box-sizing:border-box}body{margin:0;background:#F0F1F3;color:#25272C;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}main{max-width:1200px;padding:44px 32px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}h1{font-size:25px;letter-spacing:-.6px;font-weight:600;margin:0}select{font:inherit;padding:9px 13px;border:1px solid #D3D5D9;border-radius:10px;background:transparent;color:inherit}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}.column{display:flex;flex-direction:column;gap:30px}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;border-radius:19px}figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}small{font-size:12px;color:#696E77;margin-left:8px}a{font-size:12px;color:#4F596B;text-decoration:none}a:hover{text-decoration:underline}.links{display:flex;gap:12px}@media(max-width:760px){main{padding:24px 20px}.columns{grid-template-columns:1fr 1fr;gap:20px}header{align-items:flex-start}h1{font-size:21px}}@media(max-width:480px){.columns{grid-template-columns:1fr}.column{gap:24px}header{margin-bottom:24px}select{font-size:12px;max-width:140px}}</style>
<main><header><h1>冰箱贴 · 简约模块</h1><select aria-label="预览数据"><option value="demo">演示数据</option><option value="empty">未配置 / 空数据</option><option value="long">长内容</option></select></header><div class="columns"></div></main>
<script>
const groups=[['clock','calendar'],['timetable','agenda'],['countdown','battery']];let modules=[];const select=document.querySelector('select');
function render(){document.querySelector('.columns').innerHTML=groups.map(group=>'<div class="column">'+group.map(id=>{const m=modules.find(m=>m.id===id);return `<figure><img alt="${m.name} · ${select.options[select.selectedIndex].text}" src="previews/${id}-${select.value}-300.png"><figcaption><span>${m.name}<small>${m.dimension.replace('*','×')}</small></span><span class="links"><a download href="${m.card}">单卡</a><a download href="${m.canvas}">画布</a></span></figcaption></figure>`}).join('')+'</div>').join('');}
fetch('modules.json').then(r=>r.json()).then(data=>{modules=data;render()});select.onchange=render;
</script></html>
