<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰箱贴 · 三组模板样稿</title><link rel="stylesheet" href="templates.css"><style>*{box-sizing:border-box}body{margin:0;background:#E8E9E5;color:#2B302A;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}main{max-width:1320px;margin:auto;padding:38px 34px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px}h1{font-size:24px;margin:0;letter-spacing:-.6px}header a,footer a{font-size:12px;color:#75806E;text-decoration:none}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px}.column{display:flex;flex-direction:column;gap:28px}.frame{min-height:370px;display:flex;align-items:center;justify-content:center;padding:24px 18px;border-radius:24px;background:#D8DCD5}.template-slot{container-type:inline-size;width:100%}figure{margin:0;min-width:0}figcaption{font-size:13px;margin-top:12px;display:flex;justify-content:space-between;gap:12px}figcaption span{font-size:11px;color:#808777}footer{margin-top:32px;font-size:11px;color:#808777}@media(max-width:720px){main{padding:24px 18px}.columns{grid-template-columns:1fr;gap:26px}.frame{min-height:350px}h1{font-size:21px}.column{gap:26px}}</style><main><header><h1>卡片模板</h1><a href="index.html">打开配置原型</a></header><div class="columns"></div><footer>照片：Painjet / Matt Buck · <a href="LICENSES.md">素材与授权</a></footer></main><script src="../../previewer/shared-models.js"></script><script src="templates.js"></script><script>
const size=Number(new URLSearchParams(location.search).get('size'));if([180,300,420].includes(size)){const style=document.createElement('style');style.textContent='main{max-width:none}.template-slot{width:'+size+'px;max-width:100%}';document.head.append(style);}const tick=new Date('2026-11-01T09:41:00+08:00').getTime();const columns=[['flip',[['natural','炭黑'],['light','暖白']]],['paper',[['natural','原色纸'],['cool','冷白纸']]],['portrait',[['sage','皮皮'],['lilac','棕猫']]]];document.querySelector('.columns').innerHTML=columns.map(([id,variants])=>'<div class="column">'+variants.map(([theme,label],i)=>{const c=TemplateStudy.defaults(id);c.theme=theme;if(id==='portrait'&&i)c.subject='tabby';return `<figure><div class="frame"><div class="template-slot">${TemplateStudy.render(c,tick)}</div></div><figcaption>${TemplateStudy.names[id]}<span>${label}</span></figcaption></figure>`;}).join('')+'</div>').join('');
