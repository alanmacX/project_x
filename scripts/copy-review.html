<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰箱贴 · 文案整理</title>
<style>
:root{color-scheme:light;--ink:#302e29;--paper:#f6f3eb;--line:#dfdbd1;--accent:#5b674d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:24px 32px 18px;background:#faf8f2;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0 0 8px}p{margin:5px 0;color:#67645e}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,select,input,textarea{font:inherit;border:1px solid var(--line);background:#fffefa;color:var(--ink);border-radius:10px;padding:8px 12px}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}input{flex:1;min-width:200px}textarea{width:100%;resize:vertical;min-height:80px;line-height:1.6}main{max-width:1400px;margin:auto;padding:18px 32px}.summary{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.item{display:grid;grid-template-columns:minmax(200px,1fr) minmax(280px,1fr);gap:22px;background:#fffefa;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}.tag{font-size:12px;color:#767269}.original{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}.editline{display:flex;align-items:center;gap:10px;margin-bottom:9px}.editline label{flex:1}.note{min-height:38px;height:42px;margin-top:8px;font-size:13px}details{font-size:12px;color:#767269;margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;padding:8px;background:#f5f3ed;border-radius:8px}summary{cursor:pointer}.delete{border-color:#b8786b;background:#fff5f2}.modified{border-color:#849171}.pager{display:flex;justify-content:center;align-items:center;gap:15px;margin:24px}#notice{font-size:13px;color:#53624d;min-height:22px}a{color:var(--accent)}@media(max-width:720px){header,main{padding:18px}.item{grid-template-columns:1fr;gap:10px}}
</style>
<header><h1>冰箱贴 · 文案整理</h1><p>左边是原文，右边可改写或标记删除。同一区域内相同文案已合并，展开可查看所有代码位置。</p><p>修改只保存在当前浏览器，不会改动 App。完成一轮后请导出 JSON 交回，CSV 可用 Excel / Numbers 整理。动态模板中的 ${…} 请保留。</p><div class="tools"><input id="search" placeholder="搜索原文、改写、备注或文件名"><select id="group"><option value="">所有区域</option></select><select id="kind"><option value="">所有类型</option></select><select id="action"><option value="">所有处理状态</option><option>保留</option><option>修改</option><option>删除</option></select><button class="primary" id="export">导出修改 JSON</button><button id="csv">导出 CSV</button><button id="import">导入修改 JSON</button><input type="file" id="file" accept="application/json,.json" hidden></div><div id="notice" role="status"></div></header>
<main><div class="summary"><span id="count"></span><span id="progress"></span></div><div id="items"></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main>
<script>
const inventory=/*__INVENTORY__*/;
const $=id=>document.getElementById(id),key='fridge-copy-review-v1-'+inventory.commit;let edits={},page=0,storageOK=true;
try{edits=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){$('notice').textContent='浏览器保存不可用，请及时导出修改。';storageOK=false}
for(const g of [...new Set(inventory.rows.map(r=>r.group))])$('group').add(new Option(g,g));
for(const g of [...new Set(inventory.rows.map(r=>r.kind))])$('kind').add(new Option(g,g));
const change=r=>edits[r.id]||{action:'保留',replacement:'',note:''};
function persist(){try{localStorage.setItem(key,JSON.stringify(edits));storageOK=true}catch(e){storageOK=false;$('notice').textContent='浏览器保存不可用，请立即导出修改 JSON。'}}
function filtered(){const q=$('search').value.trim().toLowerCase();return inventory.rows.filter(r=>(!$('group').value||r.group===$('group').value)&&(!$('kind').value||r.kind===$('kind').value)&&(!$('action').value||change(r).action===$('action').value)&&(!q||[r.text,change(r).replacement,change(r).note,...r.refs.map(x=>x.file)].join(' ').toLowerCase().includes(q)));}
function status(){const changed=inventory.rows.filter(r=>change(r).action!=='保留'||change(r).note).length;$('progress').textContent='已处理 '+changed+' / '+inventory.rows.length+' 条';}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function render(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/40));page=Math.max(0,Math.min(page,pages-1));$('items').replaceChildren();$('count').textContent='当前 '+rows.length+' 条 · 扫描 '+inventory.files+' 个文件 · 版本 '+inventory.commit;status();$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page===pages-1;
for(const r of rows.slice(page*40,page*40+40)){const c=change(r),box=node('article',undefined,'item '+(c.action==='删除'?'delete':c.action==='修改'?'modified':'')),left=node('div'),right=node('div');left.append(node('div',r.group+' / '+r.kind+' · '+r.id+(r.dynamic?' · 动态模板':''),'tag'),node('div',r.text,'original'));const detail=node('details');detail.append(node('summary',r.refs.length+' 处代码位置 / 上下文'));for(const ref of r.refs){detail.append(node('div',ref.file+':'+ref.line),node('pre',ref.context))}left.append(detail);const row=node('div',undefined,'editline'),label=node('label','处理方式'),select=node('select');for(const a of ['保留','修改','删除'])select.add(new Option(a,a));select.value=c.action;row.append(label,select);const text=node('textarea');text.value=c.replacement;text.placeholder='修改后的文案（保留原文则留空）';text.setAttribute('aria-label',r.id+' 修改后文案');const note=node('textarea',undefined,'note');note.value=c.note;note.placeholder='备注：为什么删除 / 用在哪 / 需要讨论';note.setAttribute('aria-label',r.id+' 备注');
function save(){edits[r.id]={action:select.value,replacement:text.value,note:note.value};box.className='item '+(select.value==='删除'?'delete':select.value==='修改'?'modified':'');persist();status()}
select.onchange=save;text.oninput=()=>{if(text.value&&select.value==='保留')select.value='修改';save()};note.oninput=save;right.append(row,text,note);box.append(left,right);$('items').append(box)}}
for(const id of ['search','group','kind','action'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render()});$('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};$('next').onclick=()=>{page++;render();window.scrollTo(0,0)};
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=node('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>{download('冰箱贴-文案修改.json',JSON.stringify({version:1,sourceCommit:inventory.commit,exportedAt:new Date().toISOString(),changes:inventory.rows.filter(r=>change(r).action!=='保留'||change(r).note).map(r=>({id:r.id,group:r.group,original:r.text,...change(r),refs:r.refs.map(x=>({file:x.file,line:x.line}))}))},null,2),'application/json');$('notice').textContent='已导出。把 JSON 文件交回即可定位修改；删除标记不会自动删除代码。'};
$('csv').onclick=()=>{const quote=x=>'"'+String(x).replaceAll('"','""')+'"';const data=[['ID','区域','类型','原文','处理','修改后文案','备注','代码位置'],...inventory.rows.map(r=>[r.id,r.group,r.kind,r.text,change(r).action,change(r).replacement,change(r).note,r.refs.map(x=>x.file+':'+x.line).join('\n')])].map(r=>r.map(quote).join(',')).join('\r\n');download('冰箱贴-文案清单.csv','\ufeff'+data,'text/csv;charset=utf-8')};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const data=JSON.parse(await $('file').files[0].text());if(data.version!==1||!Array.isArray(data.changes))throw Error('文件格式不正确');const valid=new Map(inventory.rows.map(r=>[r.id,r]));let accepted=0,skipped=0;for(const c of data.changes){const r=valid.get(c.id);if(!r||r.text!==c.original||!['保留','修改','删除'].includes(c.action)){skipped++;continue}edits[c.id]={action:c.action,replacement:String(c.replacement||''),note:String(c.note||'')};accepted++}persist();render();$('notice').textContent='已导入 '+accepted+' 条，跳过 '+skipped+' 条不匹配记录。'}catch(e){$('notice').textContent='导入失败：'+e.message}finally{$('file').value=''}};render();
</script></html>
